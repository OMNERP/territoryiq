version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: territoryiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-territoryiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-territoryiq_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - territoryiq_network

  redis:
    image: redis:7-alpine
    container_name: territoryiq_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - territoryiq_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: territoryiq_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-territoryiq}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-territoryiq_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme_refresh}
      PORT: 4000
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      OSRM_BASE_URL: https://router.project-osrm.org
    ports:
      - '4000:4000'
    networks:
      - territoryiq_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: territoryiq_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    ports:
      - '3000:3000'
    networks:
      - territoryiq_network

volumes:
  postgres_data:
  redis_data:

networks:
  territoryiq_network:
    driver: bridge
